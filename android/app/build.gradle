plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cedricdev0.skyline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cedricdev0.skyline'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
